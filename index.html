<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Flora Planner</title>
<link rel="stylesheet" href="css/theme.css">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header>
  <h1>🌸 Flora Planner</h1>
  <div class="toolbar">
    <button id="btn-prev">‹</button>
    <button id="btn-today">Hoje</button>
    <button id="btn-next">›</button>
    <span id="period-label"></span>
  </div>
  <div class="views">
    <button class="view-btn" data-view="month">Mês</button>
    <button class="view-btn" data-view="week">Semana</button>
    <button class="view-btn" data-view="day">Diário</button>
    <button class="view-btn" data-view="year">Ano</button>
  </div>
  <div class="actions">
    <button id="btn-new-task">+ Nova Tarefa</button>
    <button id="btn-export-pdf">PDF</button>
    <button id="btn-export-png">PNG</button>
  </div>
</header>

<main>
  <section id="view-month" class="view"></section>
  <section id="view-week" class="view"></section>
  <section id="view-day" class="view"></section>
  <section id="view-year" class="view"></section>
</main>

<div id="task-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <h2 id="modal-title">Nova Tarefa</h2>
    <form id="task-form">
      <input type="hidden" id="task-id">

      <label>Título
        <input type="text" id="task-title" required>
      </label>

      <label>Descrição
        <input type="text" id="task-description">
      </label>

      <label>Data
        <input type="date" id="task-date">
      </label>

      <label>Hora início
        <input type="time" id="task-time">
      </label>

      <label>Hora fim
        <input type="time" id="task-end-time">
      </label>

      <label>Categoria
        <select id="task-category">
          <option value="aula">Aula</option>
          <option value="estudo">Estudo</option>
          <option value="trabalho">Trabalho</option>
          <option value="pessoal">Pessoal</option>
          <option value="outro">Outro</option>
        </select>
      </label>

      <label>Prioridade
        <select id="task-priority">
          <option value="baixa">Baixa</option>
          <option value="media" selected>Média</option>
          <option value="alta">Alta</option>
        </select>
      </label>

      <label>Anotações
        <textarea id="task-notes" rows="3"></textarea>
      </label>

      <fieldset>
        <legend>Repetir em (dias da semana)</legend>
        <div class="recurrence-days">
          <label><input type="checkbox" class="recurrence-day" value="0"> Dom</label>
          <label><input type="checkbox" class="recurrence-day" value="1"> Seg</label>
          <label><input type="checkbox" class="recurrence-day" value="2"> Ter</label>
          <label><input type="checkbox" class="recurrence-day" value="3"> Qua</label>
          <label><input type="checkbox" class="recurrence-day" value="4"> Qui</label>
          <label><input type="checkbox" class="recurrence-day" value="5"> Sex</label>
          <label><input type="checkbox" class="recurrence-day" value="6"> Sáb</label>
        </div>
        <label style="margin-top:8px;">Repetir até
          <input type="date" id="task-recurrence-until">
        </label>
      </fieldset>

      <div class="modal-actions">
        <button type="button" id="btn-delete-task" style="display:none;">Excluir</button>
        <button type="button" id="btn-cancel-task">Cancelar</button>
        <button type="submit">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="js/StorageManager.js"></script>
<script src="js/TaskManager.js"></script>
<script src="js/CalendarView.js"></script>
<script src="js/PdfExporter.js"></script>
<script src="js/main.js"></script>
</body>
</html>
